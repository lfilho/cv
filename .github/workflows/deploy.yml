name: Deploy to Cloudflare Pages

on:
    push:
        branches: [main]
        paths:
            - 'src/**'
            - 'public/**'
            - 'functions/**'
            - 'public/_routes.json'
            - 'astro.config.mjs'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/deploy.yml'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository using git
              uses: actions/checkout@v4

            - name: Install and build
              uses: withastro/action@v4

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/pages-action@v1
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
                  directory: dist
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit and push PDF changes
              run: |
                  git config --global user.email "github-actions@github.com"
                  git config --global user.name "github-actions"
                  git remote set-url origin https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
                  git add public/cv/pdf/*.pdf
                  git commit -m "chore: update PDF from CI" || exit 0
                  git push
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
